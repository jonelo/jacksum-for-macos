# Settings for bin/make_pdf.sh, which renders a Markdown file to a PDF that
# looks like the file does on github.com.

# Defaults if make_pdf.sh is called without arguments. Both are relative to the
# root of the repository.
MD_FILE_DEFAULT="README.md"
PDF_FILE_DEFAULT="resources/dmg/readme.pdf"

# The Markdown rendering service. mode "markdown" is how GitHub renders a file
# in a repository; mode "gfm" would turn every single line break into a <br>.
API_URL="https://api.github.com/markdown"
API_MODE="markdown"

# Set GITHUB_TOKEN in the environment to raise the rate limit of that API from
# 60 to 5000 requests per hour. In GitHub Actions use
# env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Page setup, any CSS value for the @page rule is allowed.
PAGE_SIZE="A4"
PAGE_MARGIN="14mm 12mm"

# Base font size of the document. github.com uses 16px on a much wider page.
FONT_SIZE="13px"

# Leave FONT_FAMILY empty to use the font stack of github-markdown.css, which
# resolves to the system UI font, so the same document looks slightly different
# on macOS and on a Linux CI runner. Set a font stack that is installed on all
# of your build machines to get the same typography everywhere, e. g.
# FONT_FAMILY="'DejaVu Sans', sans-serif"
FONT_FAMILY=""

# The lang attribute of the generated HTML.
HTML_LANG="en"

# Download all images and embed them as data: URIs before printing. That makes
# the print step independent of the network and of the short lived signed URLs
# that GitHub hands out for images. --no-embed overrides it.
EMBED_IMAGES="true"

# Should bin/make_all.sh refresh PDF_FILE_DEFAULT when MD_FILE_DEFAULT is newer?
MAKE_PDF_IN_MAKE_ALL="true"

# Where to look for a Chrome or Chromium to print with. The environment
# variable CHROME wins over this list.
CHROME_CANDIDATES=(
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  "/Applications/Chromium.app/Contents/MacOS/Chromium"
  "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"
  "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"
  "google-chrome"
  "google-chrome-stable"
  "chromium"
  "chromium-browser"
  "microsoft-edge"
)

# How many seconds to wait for Chrome before the print job is given up.
CHROME_TIMEOUT=120
