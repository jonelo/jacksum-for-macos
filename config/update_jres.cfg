# Coordinates for bin/update_jres.sh, which downloads the Eclipse Temurin JREs
# that bin/make_app.sh bundles into the installer .app.

# Feature version to download. Leave it empty to let the script pick the most
# recent LTS release automatically (e. g. 25). Set it to a number (e. g. 21) to
# pin a particular release. A command line argument wins over this value.
JRE_FEATURE_VERSION=

# Which binaries do we want? Both architectures are required by make_app.sh.
JRE_ARCHS="x64 aarch64"
JRE_OS=mac
JRE_IMAGE_TYPE=jre
JRE_JVM_IMPL=hotspot
JRE_VENDOR=eclipse

ADOPTIUM_API=https://api.adoptium.net/v3
